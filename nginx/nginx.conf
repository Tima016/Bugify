# =============================================
# Bugify NGINX — Reverse Proxy & Security Edge
# =============================================

# --- Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=20r/s;

upstream backend_api {
    server backend:3001;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Global Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: uncomment when TLS is configured
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Request Size Limits ---
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # --- Timeouts ---
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # --- Hide Server Info ---
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # --- Health Check ---
    location /nginx-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # --- Auth Endpoints (Strict Rate Limit) ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- GraphQL Endpoint (Own Rate Limit) ---
    location /graphql {
        limit_req zone=graphql_limit burst=15 nodelay;
        limit_req_status 429;

        # Block introspection queries in production
        # (also enforced at Apollo level, this is defense-in-depth)
        if ($request_body ~* "__schema") {
            return 403;
        }

        proxy_pass http://backend_api/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- API (General Rate Limit) ---
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for HMR / Next.js live reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Block common attack paths ---
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }

    location ~ /\.(php|asp|aspx|jsp)$ {
        deny all;
        return 404;
    }
}
