# =============================================
# Bugify — Production Docker Compose
# Hardened: no exposed DB ports, worker isolated,
# NGINX edge proxy, restart policies
# =============================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:15-alpine
    container_name: bugify-postgres
    environment:
      POSTGRES_USER: bugify
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bugify
    # NO host port binding — internal only
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugify-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugify}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: bugify-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - bugify-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Elasticsearch ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bugify-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    expose:
      - "9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bugify-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------- MinIO (S3) ----------
  minio:
    image: minio/minio:latest
    container_name: bugify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - bugify-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- Backend API (Producer Only) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugify-backend
    environment:
      DATABASE_URL: postgresql://bugify:password@postgres:5432/bugify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      S3_BUCKET_NAME: bugify-uploads
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bugify-internal
    restart: unless-stopped

  # ---------- Worker (BullMQ Consumer) ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugify-worker
    entrypoint: [ "dumb-init", "--" ]
    command: [ "node", "dist/src/worker/worker.main.js" ]
    environment:
      DATABASE_URL: postgresql://bugify:password@postgres:5432/bugify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      S3_BUCKET_NAME: bugify-uploads
      NODE_ENV: production
    # No ports exposed — this is a background processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - bugify-internal
    restart: unless-stopped

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./uzsecure
      dockerfile: Dockerfile
    container_name: bugify-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - bugify-internal
    restart: unless-stopped

  # ---------- NGINX Reverse Proxy ----------
  nginx:
    image: nginx:alpine
    container_name: bugify-nginx
    ports:
      - "80:80"
      # - "443:443"  # Uncomment when TLS certs are configured
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # TLS certs
    depends_on:
      - backend
      - frontend
    networks:
      - bugify-internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  bugify-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
